name: 'Strata Terraform Plan Analysis'
description: 'Analyze Terraform plans with Strata and provide clear summaries'
author: 'Arjen Schwarz'
branding:
  icon: 'file-text'
  color: 'purple'

inputs:
  plan-file:
    description: 'Path to Terraform plan file'
    required: true
  output-format:
    description: 'Output format (table, json, markdown, html, csv)'
    required: false
    default: 'markdown'
  config-file:
    description: 'Path to custom Strata config file. The action fails if a non-empty path does not exist or is not readable.'
    required: false
  show-details:
    description: 'Show detailed change information'
    required: false
    default: 'false'
  expand-all:
    description: 'Expand all collapsible sections in the output'
    required: false
    default: 'false'
  highlight-dangers:
    description: 'Highlight potentially dangerous changes'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}
  comment-on-pr:
    description: 'Whether to comment on PR'
    required: false
    default: 'true'
  update-comment:
    description: 'Whether to update existing comment instead of creating new ones'
    required: false
    default: 'true'
  comment-header:
    description: 'Custom header for PR comments'
    required: false
    default: '🏗️ Terraform Plan Summary'
  strata-version:
    description: 'Specific Strata version to use (default: latest). A pinned version that cannot be downloaded fails the action; it never falls back to latest.'
    required: false
    default: 'latest'

outputs:
  summary:
    description: 'Plan summary text'
    value: ${{ steps.strata-analysis.outputs.summary }}
  has-changes:
    description: 'Whether the plan contains resource or output changes'
    value: ${{ steps.strata-analysis.outputs.has-changes }}
  has-dangers:
    description: 'Whether dangerous changes were detected'
    value: ${{ steps.strata-analysis.outputs.has-dangers }}
  json-summary:
    description: 'Full summary in JSON format'
    value: ${{ steps.strata-analysis.outputs.json-summary }}
  change-count:
    description: 'Total number of changes (Total Changes from the summary statistics plus non-no-op output changes)'
    value: ${{ steps.strata-analysis.outputs.change-count }}
  danger-count:
    description: 'Number of dangerous changes'
    value: ${{ steps.strata-analysis.outputs.danger-count }}

runs:
  using: 'composite'
  steps:
    - name: Setup Strata Cache
      uses: actions/cache@v3
      id: strata-cache
      with:
        path: ~/.cache/strata
        # actions/cache falls back to prefix matches of the key (and of any
        # restore-keys) after an exact miss. The fixed "-bin" suffix after the
        # version keeps one version's key from being a prefix of another's
        # (e.g. v1.2.3 vs v1.2.30). action.sh still checks the restored
        # binary's --version against the requested version (or the current
        # release for "latest") and re-downloads on a mismatch.
        key: strata-binary-${{ runner.os }}-${{ runner.arch }}-${{ inputs.strata-version }}-bin
    
    - name: Run Strata Analysis
      id: strata-analysis
      shell: bash
      run: ${{ github.action_path }}/action.sh
      env:
        INPUT_PLAN_FILE: ${{ inputs.plan-file }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_SHOW_DETAILS: ${{ inputs.show-details }}
        INPUT_EXPAND_ALL: ${{ inputs.expand-all }}
        INPUT_HIGHLIGHT_DANGERS: ${{ inputs.highlight-dangers }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        INPUT_UPDATE_COMMENT: ${{ inputs.update-comment }}
        INPUT_COMMENT_HEADER: ${{ inputs.comment-header }}
        INPUT_STRATA_VERSION: ${{ inputs.strata-version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}